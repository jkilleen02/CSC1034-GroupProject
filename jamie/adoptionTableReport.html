<!doctype html>
<html lang="en">

<head>
    <link href="css/styles.css" type="text/css" rel="stylesheet">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Animal Rescue NI</title>
</head>

<body>
    <h1 id="title">Animal Rescue NI <xsmall>&copy; 2026</xsmall>
    </h1>
    <div id="header">
        <h2>Welcome to the Animal Rescue NI</h2>
        <h3>Helping restore our wildlife!</h3>
        <div class="return-buttons">
            <h4>
                <a href="adoptionsIndex.html">Return to Adoption Dashboard</a>
                <a href="index.html">Return to Main Menu</a>
            </h4>
        </div>
        <div class="main">
            <br>
            <hr>
            <br>
            <h2>All Adoptions</h2>
            <div id="output"></div>
        </div>
    </div>

    <script src="js/myJs.js"></script>
    <script>
        const printTable = async () => {
            const output = document.querySelector("#output");
            const sql = "SELECT adoptionID, adoptionFee, animalID, adoptionStatus, memberID, adoptionDate FROM tbladoption;";
            const result = await runQuery(sql);
            if (!result || result.data.length === 0) {
                output.textContent = "No Rows Returned";
                return;
            }
            const rows = result.data;

            // Create the table
            const table = document.createElement("table");
            table.className = "report-table";

            // Create the header row
            const headerRow = document.createElement("tr");
            const thAdoptionID = document.createElement("th");
            const thAdoptionFee = document.createElement("th");
            const thAnimalID = document.createElement("th");
            const thAdoptionStatus = document.createElement("th");
            const thMemberID = document.createElement("th");
            const thAdoptionDate = document.createElement("th");

            // Input the labels of each header section
            thAdoptionID.textContent = "Adoption ID";
            thAdoptionFee.textContent = "Adoption Fee";
            thAnimalID.textContent = "Animal ID";
            thAdoptionStatus.textContent = "Adoption Status";
            thMemberID.textContent = "Member ID";
            thAdoptionDate.textContent = "Adoption Date";

            // Place the labels into the header row
            headerRow.appendChild(thAdoptionID);
            headerRow.appendChild(thAdoptionFee);
            headerRow.appendChild(thAnimalID);
            headerRow.appendChild(thAdoptionStatus);
            headerRow.appendChild(thMemberID);
            headerRow.appendChild(thAdoptionDate);
            table.appendChild(headerRow);

            // Create one table row for each adoption
            for (let row of rows) {
                const tr = document.createElement("tr");

                const tdAdoptionID = document.createElement("td");
                const tdAdoptionFee = document.createElement("td");
                const tdAnimalID = document.createElement("td");
                const tdAdoptionStatus = document.createElement("td");
                const tdMemberID = document.createElement("td");
                const tdAdoptionDate = document.createElement("td");

                // Insert data into the table
                tdAdoptionID.textContent = row.adoptionID;
                tdAdoptionFee.textContent = row.adoptionFee;
                tdAnimalID.textContent = row.animalID;
                tdAdoptionStatus.textContent = row.adoptionStatus;
                tdMemberID.textContent = row.memberID;
                tdAdoptionDate.textContent = row.adoptionDate;

                tr.appendChild(tdAdoptionID);
                tr.appendChild(tdAdoptionFee);
                tr.appendChild(tdAnimalID);
                tr.appendChild(tdAdoptionStatus);
                tr.appendChild(tdMemberID);
                tr.appendChild(tdAdoptionDate);
                table.appendChild(tr);
            }
            output.appendChild(table);
        };

        document.addEventListener("DOMContentLoaded", printTable);
    </script>
</body>

</html>
