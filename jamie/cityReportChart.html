<!doctype html>
<html lang="en">

<head>
    <link href="css/styles.css" type="text/css" rel="stylesheet">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Animal Rescue NI</title>
</head>

<body>
    <h1 id="title">Animal Rescue NI <xsmall>&copy; 2026</xsmall>
    </h1>
    <div id="header">
        <h2>Welcome to the Animal Rescue NI</h2>
        <h3>Helping restore our wildlife!</h3>
        <div class="return-buttons">
            <h4><a href="memberIndex.html">Return to Member Dashboard</a><a href="index.html">Return
                    to Main Menu</a><a href="memberReports.html">Return to Member Reports</a></h4>
        </div>
        <div class="main">
            <br>
            <hr>
            <br>
            <h2>Towns with the Most Members</h2>

            <br>
            <canvas id="myCityChart"></canvas>

            <div id="message" class="message"></div>
        </div>
    </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/myJs.js"></script>
    <script>
        const printChart = async () => {
            const output = document.querySelector("#message");
            //Implement my SQL report
            const sql = "SELECT UPPER(memberTown)AS townName,COUNT(*) AS numberOfMembers FROM tblmembers WHERE memberTown IS NOT NULL GROUP BY UPPER(memberTown) ORDER BY numberOfMembers DESC LIMIT 5;";
            const result = await runQuery(sql);
            //If there is no data in database return message
            if (!result || !result.data || result.data.length === 0) {
                output.textContent = "No Rows Returned";
                output.className = "message error";
                return;
            }

            const rows = result.data;
            const labels = [];
            const members = [];
            for (let row of rows) {
                labels.push(`${row.townName}`);
                members.push(Number(row.numberOfMembers));
            }
            //Create a bar chart with labels and data
            const chartCanvas = document.querySelector("#myCityChart");
            new Chart(chartCanvas, {
                type: "bar", data: {
                    labels: labels,
                    datasets: [{
                        label: "Number of Members",
                        data: members,
                        //A range of nature like colours
                        backgroundColor: [
                            "#2E8B57",
                            "#6CC24A",
                            "#8B4513",
                            "#A3C1AD",
                            "#556B2F",
                            "#C2B280",
                            "#3B5323"
                        ],
                        borderColor: "#000000",
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 20
                        }
                    }
                }
            });
        };
        //Once the page is ready the chart is made
        document.addEventListener("DOMContentLoaded", printChart);
    </script>
</body>

</html>
