            </div>
            <div class="form-row">
                <label for="adoptionDate">Adoption Date</label>
                <input type="number" id="adoptionDate">
            </div>

            <button type="submit">Register Adoption</button>

        </form>
        <div id="output" class="message"></div>
    </div>
    <script src="js/myJs.js"></script>
    <script>
        const showMessage = (text, type) => {
            const output = document.querySelector("#output");
            output.textContent = text;
            output.className = `message ${type}`;
        };
        document.querySelector("#adoptionForm").addEventListener("submit", async (event) => {
            event.preventDefault();

                animalID: Number(document.querySelector("#animalID").value),
                adoptionStatus: document.querySelector("#adoptionStatus").value.trim(),
                memberID: Number(document.querySelector("#memberID").value),
                adoptionDate: document.querySelector("#adoptionID").value.trim()

VALUES (
