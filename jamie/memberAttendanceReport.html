<!doctype html>
<html lang="en">

<head>
    <link href="css/styles.css" type="text/css" rel="stylesheet">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Animal Rescue NI</title>
</head>

<body>
    <h1 id="title">Animal Rescue NI <xsmall>&copy; 2026</xsmall>
    </h1>
    <div id="header">
        <h2>Welcome to the Animal Rescue NI</h2>
        <h3>Helping restore our wildlife!</h3>
        <div class="return-buttons">
            <h4><a href="memberIndex.html">Return to Member Dashboard</a><a href="index.html">Return
                    to Main Menu</a><a href="memberReports.html">Return to Member Reports</a></h4>
        </div>
        <div class="main">
            <br>
            <hr>
            <br>
            <h2>Members who have not Attended a Fundraiser</h2>
            <div id="output"></div>
        </div>
    </div>
    <script src="js/myJs.js"></script>
    <script>
        const printTable = async () => {
            const output = document.querySelector("#output");
            //Implement my SQL report
            const sql = "SELECT m.memberID,CONCAT(m.memberFirstName, ' ', m.memberLastName) AS fullName,UPPER(m.memberTown) AS townUppercase FROM tblmembers m LEFT JOIN tblmember_fundraiser mf ON m.memberID = mf.memberID WHERE mf.fundraiserID IS NULL ORDER BY m.memberLastName ASC;";

            const result = await runQuery(sql);
            //If there is no data allow it to return an error message
            if (!result || result.data.length === 0) {
                output.textContent = "No Rows Returned";
                return;
            }
            const rows = result.data;
            //Create the table
            const table = document.createElement("table");
            table.className = "report-table";
            //Create the header row 
            const headerRow = document.createElement("tr");
            const thMemberId = document.createElement("th");
            const thFullName = document.createElement("th");
            const thTownUppercase = document.createElement("th");

            //Input the labels of each header section
            thMemberId.textContent = "Member ID";
            thFullName.textContent = "Name";
            thTownUppercase.textContent = "Town";

            //Place the labels into the header row
            headerRow.appendChild(thMemberId);
            headerRow.appendChild(thFullName);
            headerRow.appendChild(thTownUppercase);
            table.appendChild(headerRow);
            //Create one table row for each member
            for (let row of rows) {
                const tr = document.createElement("tr");
                const tdMemberId = document.createElement("td");
                const tdFullName = document.createElement("td");
                const tdTownUppercase = document.createElement("td");
                //Insert data into the table
                tdMemberId.textContent = row.memberID;
                tdFullName.textContent = row.fullName;
                tdTownUppercase.textContent = row.townUppercase;
                tr.appendChild(tdMemberId);
                tr.appendChild(tdFullName);
                tr.appendChild(tdTownUppercase);
                table.appendChild(tr);

            }
            output.appendChild(table);
        }
        document.addEventListener("DOMContentLoaded", printTable);
    </script>
</body>

</html>
