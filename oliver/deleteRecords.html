<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WWF Donations Management</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- The page wrapper keeps the banner, navigation and page content together. -->
  <div class="page">
    <!-- The banner explains what this example is demonstrating. -->
    <div class="banner">
      <h1>WWF Donations Management</code></h1>
      <p></p>
    </div>

    <!-- Navigation links let user switch between the different examples. -->
   <div class="nav">
    <a href="donationsMain.html">return to options</a> |
    <a href="addRecord.html">Add a Record</a> |
    <a href="deleteRecords.html">Delete a Record</a> |
    <a href="updateRecords.html">Update a Record</a> |
    <a href="donationReports.html">Donation Reports</a> |
    </div>

    <!-- The main content area shows the records table and feedback messages. -->
    <div class="main">
      <h2>Browse and Delete Records</h2>
      <p>The table below shows all donations. Click delete to remove a record.</p>
      <br>
      <hr>
      <br>
      <!-- JavaScript builds the table and inserts it into this empty div. -->
      <div id="tableOutput"></div>
      <br>
      <!-- Success or error messages are shown here. -->
      <div id="message" class="message"></div>
    </div>
  </div>

  <script src="js/myJs.js"></script>
  <script>
    // Display a message after a delete action or database problem.
    const showMessage = (text, type) => {
      const output = document.querySelector("#message");
      output.textContent = text;
      output.className = `message ${type}`;
    };

    // Read all donations from the database and draw them as an HTML table.
    const printTable = async () => {
      const output = document.querySelector("#tableOutput");
      output.textContent = "";

      // Select every donation so we can display the whole table.
      const sql = "SELECT * FROM tbldonations ORDER BY donationID;";
      const result = await runQuery(sql);

      if (!result || !result.data || result.data.length === 0) {
        output.textContent = "No Rows Returned";
        return;
      }

      const rows = result.data;
      const table = document.createElement("table");
      const headerRow = document.createElement("tr");
      table.appendChild(headerRow);

      // These headings become the top row of the table.
      const headings = ["Donation ID", "Donation Date", "Amount Donated", "Payment Method", "Memebr ID", "Fundrasier ID"];

      for (let heading of headings) {
        const th = document.createElement("th");
        th.textContent = heading;
        headerRow.appendChild(th);
      }

      for (let row of rows) {
        const tr = document.createElement("tr");

        const tddonationID = document.createElement("td");
        tddonationID.textContent = row.donationID;
        tr.appendChild(tddonationID);

        const tddonationDate = document.createElement("td");
        tddonationDate.textContent = row.donationDate;
        tr.appendChild(tddonationDate);

        const tdamountDonated = document.createElement("td");
        tdamountDonated.textContent = row.amountDonated;
        tr.appendChild(tdamountDonated);

        const tdpaymentMethod = document.createElement("td");
        tdpaymentMethod.textContent = row.paymentMethod;
        tr.appendChild(tdpaymentMethod);

        const tdmemberID = document.createElement("td");
        tdmemberID.textContent = row.memberID;
        tr.appendChild(tdmemberID);

        const tdfundraiserID = document.createElement("td");
        tdfundraiserID.textContent = row.fundraiserID;
        tr.appendChild(tdfundraiserID);

        // ADD DELETE FUNCTIONALITY HERE
        const tdDelete = document.createElement("td");
        const deleteButton  = document.createElement("button");
        deleteButton.textContent = "Delete " + row.donationID;

        deleteButton.addEventListener("click", async () => {
          const shouldDelete = confirm(`Delete Donation ${row.donationID}?`);
          if(!shouldDelete) {
            return;
          } 

          const deleteSQL = `DELETE FROM tbldonations WHERE donationID = ${row.donationID};`;
          console.log(deleteSQL);

          const deleteResult = await runQuery(deleteSQL);

          if(deleteResult && deleteResult.success) {
            showMessage("Donation record deleted successfuly.", "success");
            printTable();
            return;
          }

          if(deleteResult && deleteResult.error) {
            showMessage(deleteResult.error, "error");
          } else {
            showMessage("Unable to deete this record", "error");
          }

        });


        tdDelete.appendChild(deleteButton);
        tr.appendChild(tdDelete);
        table.appendChild(tr);
      }

      output.appendChild(table);
    };

    // Build the table as soon as the page has finished loading.
    document.addEventListener("DOMContentLoaded", () => {
      printTable();
    });
  </script>
</body>

</html>
