<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WWF Donations Management</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- The page wrapper keeps the layout consistent with the other examples. -->
  <div class="page">
    <!-- The banner introduces this page as the UPDATE example. -->
    <div class="banner">
      <h1>WWF Donations Management</code></h1>
      <p></p>
    </div>

    <!-- Navigation links connect all of the database examples together. -->
   <div class="nav">
    <a href="donationsMain.html">return to options</a> |
    <a href="addRecord.html">Add a Record</a> |
    <a href="deleteRecords.html">Delete a Record</a> |
    <a href="updateRecords.html">Update a Record</a> |
    <a href="donationReports.html">Donation Reports</a> |
    </div>

    <!-- The main area holds the table, the edit form and feedback messages. -->
    <div class="main">
      <h2>Browse and Edit Records</h2>
      <p>The table below shows all donations. Click edit to load a row into the form.</p>
      <br>
      <hr>
      <br>
      <!-- JavaScript creates the table and places it here. -->
      <div id="tableOutput"></div>
      <br>
      <hr>
      <br>

      <h2>Edit Selected Record</h2>
      <!-- This text reminds the user which donation is currently loaded into the form. -->
      <p id="selectedDonationText" class="muted">Choose a Donation from the table first.</p>

      <!-- The form is filled in automatically when the user clicks an Edit button. -->
      <form id="editForm">
         <div class="form-row">
          <label for="donationDate">Donation Date</label>
          <input type="date" id="donationDate">
        </div>

        <div class="form-row">
          <label for="amountDonated">Donation Amount</label>
          <input type="number" id="amountDonated">
        </div>

        <div class="form-row">
          <label for="paymentMethod">Payment Method</label>
          <input type="text" id="paymentMethod">
        </div>

        <div class="form-row">
          <label for="memberID">Member ID</label>
          <input type="number" id="memberID">
        </div>

        <div class="form-row">
          <label for="fundraiserID">Fundraiser ID</label>
          <input type="number" id="fundraiserID">
        </div>

        <button type="submit">Update Record</button>
      </form>

      <!-- Messages about validation or database results appear here. -->
      <div id="message" class="message"></div>
    </div>
  </div>

  <script src="js/myJs.js"></script>
  <script>
    // This remembers which record was chosen from the table.
    let selectedDonationID = null;

    // Show a success or error message below the form.
    const showMessage = (text, type) => {
      const output = document.querySelector("#message");
      output.textContent = text;
      output.className = `message ${type}`;
    };

    // Clear any old message so the page does not show stale feedback.
    const clearMessage = () => {
      const output = document.querySelector("#message");
      output.textContent = "";
      output.className = "message";
    };

    // Put the form back into its starting state.
    const resetForm = () => {
      const form = document.querySelector("#editForm");
      const selectedStudentText = document.querySelector("#selectedDonationText");

      form.reset();
      selectedDonationID = null;
      selectedDonationText.textContent = "Choose a donation from the table first.";
    };

    // Copy the chosen student's data from the table into the form fields.
    const selectDonation = (donation) => {
      const selectedDonationText = document.querySelector("#selectedDonationText");

      selectedDonationID = Number(donation.donationID);
      document.querySelector("#donationDate").value = donation.donationDate;
      document.querySelector("#amountDonated").value = donation.amountDonated;
      document.querySelector("#paymentMethod").value = donation.paymentMethod;
      document.querySelector("#memberID").value = donation.memberID;
      document.querySelector("#fundraiserID").value = donation.fundraiserID;
      selectedDonationText.textContent = `Editing donation ${donation.donationDate}: ${donation.amountDonated} ${donation.paymentMethod}`;
      clearMessage();
    };

    // Load all donations from the database and display them in a table.
    const printTable = async () => {
      const output = document.querySelector("#tableOutput");
      output.textContent = "";

      // Read every row so the user can choose one to edit.
      const sql = "SELECT * FROM tbldonations ORDER BY donationID;";
      const result = await runQuery(sql);

      if (!result || !result.data || result.data.length === 0) {
        output.textContent = "No Rows Returned";
        return;
      }

      const rows = result.data;
      const table = document.createElement("table");
      const headerRow = document.createElement("tr");
      table.appendChild(headerRow);

      // Create the table headings once before the donation rows are added.
      const headings = ["Donation ID", "Donation Date", "Amount Donated", "Payment Type", "Member ID", "Fundraiser ID"];

      for (let heading of headings) {
        const th = document.createElement("th");
        th.textContent = heading;
        headerRow.appendChild(th);
      }

      for (let row of rows) {
        const tr = document.createElement("tr");

        const tddonationID = document.createElement("td");
        tddonationID.textContent = row.donationID;
        tr.appendChild(tddonationID);

        const tddonationDate = document.createElement("td");
        tddonationDate.textContent = row.donationDate;
        tr.appendChild(tddonationDate);

        const tdamountDonated = document.createElement("td");
        tdamountDonated.textContent = row.amountDonated;
        tr.appendChild(tdamountDonated);

        const tdpaymentMethod = document.createElement("td");
        tdpaymentMethod.textContent = row.paymentMethod;
        tr.appendChild(tdpaymentMethod);

        const tdmemberID = document.createElement("td");
        tdmemberID.textContent = row.memberID;
        tr.appendChild(tdmemberID);

        const tdfundraiserID = document.createElement("td");
        tdfundraiserID.textContent = row.fundraiserID;
        tr.appendChild(tdfundraiserID);

        const tdEdit = document.createElement("td");
        const editButton = document.createElement("button");
        editButton.textContent = "Edit";

        editButton.addEventListener("click", () => {
          selectDonation(row);
        });

        tdEdit.appendChild(editButton);
        tr.appendChild(tdEdit);
        table.appendChild(tr);
      }

      output.appendChild(table);
    };

    // Set up the page when the browser has finished loading the HTML.
    document.addEventListener("DOMContentLoaded", () => {
      resetForm();
      printTable();
    });

    // Update the chosen donations when the form is submitted.
    document.querySelector("#editForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      if (selectedDonationID === null) {
        showMessage("Choose a donation from the table before updating.", "error");
        return;
      }

      const donation = {
        donationDate: document.querySelector("#donationDate").value.trim(),
        amountDonated: Number(document.querySelector("#amountDonated").value),
        paymentMethod: document.querySelector("#paymentMethod").value.trim(),
        memberID: Number(document.querySelector("#memberID").value),
        fundraiserID: Number(document.querySelector("#fundraiserID").value)
      };

      // Reuse the same validation rules as the add-record page.
      const validationMessage = validateDonation(donation);
      if (validationMessage) {
        showMessage(validationMessage, "error");
        return;
      }

      const sql = `
        UPDATE tbldonations
        SET
          donationDate = '${escapeSql(donation.donationDate)}',
          amountDonated = ${donation.amountDonated},
          paymentMethod = '${escapeSql(donation.paymentMethod)}',
          memberID = ${donation.memberID},
          fundraiserID = ${donation.fundraiserID}
        WHERE donationID = ${selectedDonationID};
      `;

      // console.log(sql);

      const result = await runQuery(sql);

      if (result && result.success) {
        showMessage("Donation record updated successfully.", "success");
        resetForm();
        printTable();
        return;
      }

      if (result && result.error) {
        showMessage(result.error, "error");
      } else {
        showMessage("Unable to update the record.", "error");
      }      
      

    });
  </script>
</body>

</html>
